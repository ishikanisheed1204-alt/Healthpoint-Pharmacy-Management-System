
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main-container">

    <aside>
        <h2>HealthPoint</h2>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="medicines.html">Medicines</a></li>
                <li><a href="suppliers.html">Suppliers</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="billing.html">Billing</a></li>
                <li><a href="prescriptions.html">Prescriptions</a></li>
                <li><a href="notifications.html">Notifications</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <a href="index.html" class="logout-link">Logout</a>
    </aside>

    <main>
        <h1>Sales and Billing</h1>

        <section id="billing">
            <h2>Create New Bill</h2>
            <form>
                <label for="customer">Customer Name:</label>
                <input type="text" id="customer" required>

                <label for="medicine">Medicine Name:</label>
                <input type="text" id="medicine" required>

                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" oninput="calculateTotal()" required>

                <label for="price">Price per Unit:</label>
                <input type="number" id="price" oninput="calculateTotal()" required>

                <label for="payment">Payment Method:</label>
                <select id="payment" required>
                    <option value="">Select Method</option>
                    <option>Cash</option>
                    <option>Card</option>
                    <option>UPI</option>
                </select>

                <h3>Grand Total: <span id="grand-total">₹0</span></h3>
                <button type="button" onclick="generateBill()">Generate Bill</button>
            </form>
        </section>
    </main>

</div>
<script src="js/billing.js"></script>
</body>
</html>
