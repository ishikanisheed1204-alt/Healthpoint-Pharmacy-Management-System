
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pharmacy Management System - Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Registration Section -->

    <div id="login-container">

        <h1 class="signup-title">HealthPoint</h1>

        <h2>Create New Account</h2>

        <form id="register-form">

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname"
                   placeholder="Enter your full name" required> <br>

            <label for="email">Email:</label>
            <input type="email" id="email"
                   placeholder="Enter your email" required> <br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone"
                   placeholder="Enter your phone number" required> <br>

            <label for="username">Username:</label>
            <input type="text" id="username"
                   placeholder="Create a username" required> <br>

            <label for="password">Password:</label>
            <input type="password" id="password"
                   placeholder="Create a password" required> <br>

            <button type="button" onclick="registerUser()">Register</button>
                <p id="signup-message"></p> 
        </form>

        <p>
            Already have an account?
            <a href="index.html">Login here</a>
        </p>

    </div>
<script src="js/signup.js"></script>
</body>
</html>
